stages:
  - build
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  RUST_VERSION: "1.92.0"
  PKG_CONFIG_ALLOW_CROSS: "1"

.rust-install: &rust-install
  - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain ${RUST_VERSION}
  - export PATH="$HOME/.cargo/bin:$PATH"
  - rustup default ${RUST_VERSION}

deb:
  stage: build
  image: ubuntu:26.04
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y curl build-essential devscripts debhelper-compat meson ninja-build libgtk-4-dev libadwaita-1-dev blueprint-compiler libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libges-1.0-dev pkg-config libglib2.0-dev desktop-file-utils appstream gettext git
    - *rust-install
  script:
    - export PATH="$HOME/.cargo/bin:$PATH"
    - VERSION=$(echo "$CI_COMMIT_TAG" | sed 's/^v//')
    - test -z "$VERSION" && VERSION=$(grep -m1 "version:" meson.build | grep -o '[0-9.]*')
    - echo "Building version $VERSION"
    - mkdir -p footage-${VERSION}
    - git archive HEAD | tar -x -C footage-${VERSION}
    - cp -a debian footage-${VERSION}/
    - sed -i "1s/\(.*\)(\([^)]*\))\(.*\)/\1(${VERSION}-1)\3/" footage-${VERSION}/debian/changelog
    - unset PKG_CONFIG_SYSROOT_DIR
    - TOOLCHAIN="$HOME/.rustup/toolchains/${RUST_VERSION}-x86_64-unknown-linux-gnu"
    - ln -sf "$TOOLCHAIN/bin/rustc" /usr/bin/rustc
    - ln -sf "$TOOLCHAIN/bin/cargo" /usr/bin/cargo
    - ln -sf "$TOOLCHAIN/bin/rustup" /usr/bin/rustup
    - cd footage-${VERSION}
    - debuild -us -uc -b
  artifacts:
    paths:
      - footage_*.deb
    expire_in: 2 weeks

appimage:
  stage: build
  image: ubuntu:26.04
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y curl wget fuse libfuse2 file meson ninja-build libgtk-4-dev libadwaita-1-dev blueprint-compiler libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libges-1.0-dev pkg-config libglib2.0-dev desktop-file-utils gettext appstream git
    - *rust-install
  script:
    - export PATH="$HOME/.cargo/bin:$PATH"
    - unset PKG_CONFIG_SYSROOT_DIR
    - meson setup builddir --prefix=/usr
    - ninja -C builddir
    - DESTDIR=$(pwd)/appdir ninja -C builddir install
    - mkdir -p appdir/usr/share/applications appdir/usr/share/icons/hicolor/scalable/apps appdir/usr/share/metainfo
    - cp builddir/data/io.gitlab.adhami3310.Footage.desktop appdir/io.gitlab.adhami3310.Footage.desktop
    - cp data/resources/icons/hicolor/scalable/apps/io.gitlab.adhami3310.Footage.svg appdir/footage.svg
    - cp builddir/data/io.gitlab.adhami3310.Footage.metainfo.xml appdir/usr/share/metainfo/footage.appdata.xml
    - sed -i 's|Exec=.*|Exec=footage|' appdir/io.gitlab.adhami3310.Footage.desktop
    - sed -i 's|Icon=.*|Icon=footage|' appdir/io.gitlab.adhami3310.Footage.desktop
    - cat > appdir/AppRun << 'EOF'
    - |
      #!/bin/bash
      set -e
      HERE="$(dirname "$(readlink -f "$0")")"
      export PATH="${HERE}/usr/bin:${PATH}"
      export LD_LIBRARY_PATH="${HERE}/usr/lib:${HERE}/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH}"
      export XDG_DATA_DIRS="${HERE}/usr/share:${XDG_DATA_DIRS}"
      export APPDIR="${HERE}"
      exec "${HERE}/usr/bin/footage" "$@"
    - chmod +x appdir/AppRun
    - wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
    - chmod +x appimagetool
    - APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool --no-appstream appdir footage-x86_64.AppImage
  artifacts:
    paths:
      - footage-x86_64.AppImage
    expire_in: 2 weeks

rpm:
  stage: build
  image: ubuntu:26.04
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y curl rpm meson ninja-build libgtk-4-dev libadwaita-1-dev blueprint-compiler libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libges-1.0-dev pkg-config desktop-file-utils gettext appstream libglib2.0-dev git
    - *rust-install
  script:
    - export PATH="$HOME/.cargo/bin:$PATH"
    - VERSION=$(echo "$CI_COMMIT_TAG" | sed 's/^v//')
    - test -z "$VERSION" && VERSION=$(grep -m1 "version:" meson.build | grep -o '[0-9.]*')
    - echo "Building version $VERSION"
    - unset PKG_CONFIG_SYSROOT_DIR
    - mkdir -p /tmp/rpmbuild/BUILD /tmp/rpmbuild/RPMS /tmp/rpmbuild/SOURCES /tmp/rpmbuild/SPECS /tmp/rpmbuild/SRPMS
    - sed -E "s/^(Version:).*/\1        ${VERSION}/" rpmbuild/SPECS/footage.spec > /tmp/rpmbuild/SPECS/footage.spec
    - tar -czf /tmp/rpmbuild/SOURCES/Footage-v${VERSION}.tar.gz --transform="s#^\.#Footage-v${VERSION}#" .
    - rpmbuild -bb --nodeps --define "_topdir /tmp/rpmbuild" /tmp/rpmbuild/SPECS/footage.spec
    - cp /tmp/rpmbuild/RPMS/x86_64/footage-*.rpm .
  artifacts:
    paths:
      - footage-*.rpm
    expire_in: 2 weeks

pacman:
  stage: build
  image: archlinux:latest
  before_script:
    - pacman -Syu --noconfirm base-devel sudo
    - useradd -m builduser
    - echo 'builduser ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
  script:
    - |
      set -e
      VERSION=$(echo "$CI_COMMIT_TAG" | sed 's/^v//')
      test -z "$VERSION" && VERSION=$(grep -m1 "version:" meson.build | grep -o '[0-9.]*')
      cat > PKGBUILD << PKGBUILD_EOF
      pkgname=footage
      pkgver=${VERSION}
      pkgrel=1
      pkgdesc="Trim and edit short videos and screencasts"
      arch=('x86_64')
      url="https://gitlab.com/adhami3310/Footage"
      license=('GPLv3')
      depends=('gtk4' 'libadwaita' 'gstreamer' 'gst-plugins-base' 'gst-plugins-good' 'gst-plugins-bad' 'gst-plugins-ugly' 'gst-libav')
      makedepends=('meson' 'ninja' 'rust' 'cargo' 'blueprint-compiler')
      source=("https://github.com/adhami3310/Footage/archive/v\${pkgver}.tar.gz")
      sha256sums=('SKIP')

      build() {
        cd "\${srcdir}/footage-\${pkgver}"
        meson setup builddir --prefix=/usr
        ninja -C builddir
      }

      package() {
        cd "\${srcdir}/footage-\${pkgver}"
        DESTDIR="\${pkgdir}" ninja -C builddir install
      }
      PKGBUILD_EOF
      chown -R builduser:builduser .
      su builduser -c 'makepkg -f --syncdeps --noconfirm --skippgpcheck'
  artifacts:
    paths:
      - footage-*.pkg.tar.zst
    expire_in: 2 weeks

release:
  stage: release
  image: ubuntu:26.04
  only:
    - tags
  needs:
    - deb
    - appimage
    - rpm
    - pacman
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Footage $CI_COMMIT_TAG"
    description: |
      Trim and edit short videos and screencasts.

      ## Installation

      ### AppImage (Universal)
      `chmod +x footage-x86_64.AppImage && ./footage-x86_64.AppImage`

      ### Debian/Ubuntu
      `sudo dpkg -i footage_*.deb && sudo apt-get install -f`

      ### RPM (Fedora/RHEL/openSUSE)
      `sudo rpm -i footage-*.rpm`

      ### Pacman (Arch/Manjaro)
      `sudo pacman -U footage-*.pkg.tar.zst`

      ## Required Dependencies
      - GStreamer plugins (good, bad, ugly, libav)

      _Generated with AI assistance_
    assets:
      links:
        - name: "Debian package"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/footage_*.deb?job=deb"
        - name: "AppImage"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/footage-x86_64.AppImage?job=appimage"
        - name: "RPM package"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/footage-*.rpm?job=rpm"
        - name: "Pacman package"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/footage-*.pkg.tar.zst?job=pacman"
